# Readable diffs of files git would otherwise call binary: pictures, Word and
# Excel files (see `attributes` for which file gets which driver).
#
# git includes this file only where dotfiles.programs.git.diffTools is on,
# which also installs the three tools. A driver whose tool is missing makes
# `git diff`, `git show` and `git log -p` die, so the file is left out
# elsewhere, and git then says "Binary files differ".
#
# The pdf driver is in common.ini, because every machine has pdftotext.
# Slides and ODF files get no driver: LibreOffice can't export slides as text,
# and no package gives a working odt2txt.
[diff "exif"]
  textconv = exiftool
  cachetextconv = true
[diff "word"]
  textconv = pandoc --to plain
  cachetextconv = true
[diff "xls"]
  textconv = sh -c 'unoconv --stdout --format csv \"$0\"'
  cachetextconv = true
