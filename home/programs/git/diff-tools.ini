# Readable diffs of files git would otherwise call binary: pictures,
# documents and spreadsheets (see `attributes` for which file gets which
# driver). Each tool was picked for speed: every one answers in under 100 ms.
#
# git includes this file only where dotfiles.programs.git.diffTools is on,
# which also installs the tools. A driver whose tool is missing makes
# `git diff`, `git show` and `git log -p` die, so the file is left out
# elsewhere, and git then says "Binary files differ".
#
# The pdf driver is in common.ini, because every machine has pdftotext.
# Slides and .ods files get no driver: nothing small reads them.

# A picture: what exiftool knows about it, then a sketch of it in characters,
# so the diff shows the old picture and the new one. The tags left out are
# about the file on disk, not the picture; they differ on every diff. The
# sketch is 48 characters wide, the first frame of an animation. A format
# chafa can't draw only loses its sketch: the last `true` keeps the diff alive.
# The whole command is in double quotes because git reads a bare `;` as the
# start of a comment.
[diff "image"]
  textconv = "sh -c 'exiftool -S --ExifToolVersion --Directory --FileName --FileModifyDate --FileAccessDate --FileInodeChangeDate --FilePermissions \"$0\"; chafa --format symbols --colors none --animate off --size 48x14 \"$0\" 2> /dev/null; true'"
  cachetextconv = true

# Word, OpenDocument, RTF and EPUB, as Markdown: headings, lists and tables
# keep their shape, so a changed table cell is one changed line.
[diff "document"]
  textconv = pandoc --to gfm
  cachetextconv = true

# Word files from before .docx, which pandoc refuses.
[diff "doc"]
  textconv = catdoc
  cachetextconv = true

# Excel: every sheet as CSV, under its name.
[diff "xlsx"]
  textconv = xlsx2csv --all
  cachetextconv = true

# Excel files from before .xlsx. xls2csv comes with catdoc.
[diff "xls"]
  textconv = xls2csv
  cachetextconv = true
