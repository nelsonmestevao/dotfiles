[user]
  name = Nelson Estevão
  useConfigOnly = true
[gpg]
  format = ssh
[gpg "ssh"]
  allowedSignersFile = ~/.config/git/allowed_signers
[commit]
  verbose = true
  template = ~/.config/git/commit-template
[core]
  autocrlf = input
  editor = nvim
  pager = delta
[init]
  defaultBranch = main
[interactive]
  diffFilter = delta --color-only
[delta]
  # n and N jump from one file to the next in a long diff.
  navigate = true
  whitespace-error-style = 22 reverse
[alias]
  a = add
  b = branch
  c = commit
  cl = clone
  co = checkout
  h = history
  l = pull
  p = push
  fz = fuzzy
  ht = history
  rb = rebase
  rw = review
  st = status

  undo = reset --mixed HEAD~1
  co-pr = !sh -c 'git fetch origin pull/$1/head:pr/$1 && git checkout pr/$1' -
  find = log --pretty=format:'%C(yellow)%h %Cblue%ad %Creset%s' --decorate --date=short --all -S
  patch   = !git --no-pager diff
  standup = !git log --oneline --graph --all --no-merges --author=$USER --since '9am last week'

  # The same commands, compared by syntax with difftastic.
  dft   = -c diff.external=difft diff
  dshow = -c diff.external=difft show --ext-diff
  dlog  = -c diff.external=difft log -p --ext-diff
# Before every commit, in any repo: stop when the staged changes hold a
# secret. A repo's own hooks still run. To skip it once:
# git -c hook.betterleaks.enabled=false commit …
[hook "betterleaks"]
  event = pre-commit
  command = betterleaks git --pre-commit --staged --redact --verbose --no-banner --log-level warn
[branch]
  autosetuprebase = always
[log]
  date = auto:human
[diff]
  algorithm = histogram
  renames = copies
  mnemonicPrefix = true
[diff "pdf"]
  textconv = sh -c 'pdftotext -layout -enc UTF-8 \"$0\" -'
  cachetextconv = true
[merge]
  log = true
  conflictstyle = zdiff3
[fetch]
  prune = true
[push]
  default = simple
  autoSetupRemote = true
[pull]
  rebase = true
[color]
  ui = true
[url "git@github.com:nelsonmestevao/"]
  insteadOf = gh:
[url "git@github.com:"]
  insteadOf = ghx:
[url "git@gitlab.com:nelsonmestevao/"]
  insteadOf = gl:
[url "git@gitlab.com:"]
  insteadOf = glx:
[url "git@bitbucket.org:"]
  insteadOf = https://bitbucket.org/
