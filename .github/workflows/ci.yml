name: CI

on:
  # Other branches run CI once, from their pull request.
  push:
    branches: [main, wip]
  pull_request:
  # Every Monday, build everything, even what built before, to catch a
  # download that went away. GitHub runs this from the default branch only.
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: Build even when these configurations were built before
        type: boolean
        default: false

# A new push stops the run still going for the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# A step stops at its first failed command, a failed pipe included.
defaults:
  run:
    shell: bash

jobs:
  # The fast checks: lint, the tests, and every configuration read through
  # without building it. Then it decides which systems the build job builds.
  quick:
    # A pull request from this repo's main or wip gets no run of its own: the
    # push to that branch already had one.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      !contains(fromJSON('["main", "wip"]'), github.head_ref)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      systems: ${{ steps.plan.outputs.systems }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Lint
        run: nix build -L .#checks.x86_64-linux.lint
      - name: Test the helper scripts
        run: bin/test
      # All seven configurations, on both systems.
      - name: Evaluate every configuration
        run: bin/check --list > "$RUNNER_TEMP/derivations.json"
      # The rest of what `bin/check --eval` covers. Every bin/ script runs in
      # the dev shell, so a broken Mac dev shell breaks them all on the Mac.
      - name: Evaluate the dev shells and formatters
        run: >-
          nix path-info --derivation
          .#devShells.{x86_64-linux,aarch64-darwin}.default
          .#formatter.{x86_64-linux,aarch64-darwin}
          .#checks.aarch64-darwin.lint
      - name: Make a key per system
        id: keys
        run: .github/scripts/plan-builds keys "$RUNNER_TEMP/derivations.json" >> "$GITHUB_OUTPUT"
      # A marker is a tiny file that a passing build saved in GitHub's cache,
      # named by the key above. Looking here first means a Mac machine starts
      # only when there is something to build. Not every run can see every
      # marker:
      #
      # - one saved on wip is seen on wip and in pull requests into wip;
      # - one saved in a pull request is seen in that pull request only;
      # - one saved on main is seen everywhere, but main can't see wip's;
      # - GitHub deletes one that nobody read for seven days.
      #
      # A marker that can't be seen only costs one more build. It never lets
      # a broken configuration pass.
      - name: Look for the Linux marker
        id: linux
        uses: actions/cache/restore@v6
        with:
          path: .ci-marker
          key: ${{ steps.keys.outputs.x86_64-linux }}
          lookup-only: true
      - name: Look for the Mac marker
        id: mac
        uses: actions/cache/restore@v6
        with:
          path: .ci-marker
          key: ${{ steps.keys.outputs.aarch64-darwin }}
          lookup-only: true
      - name: Pick the systems to build
        id: plan
        env:
          FORCED: ${{ github.event_name == 'schedule' || inputs.force == true }}
          LINUX: ${{ steps.linux.outputs.cache-matched-key }}
          MAC: ${{ steps.mac.outputs.cache-matched-key }}
        run: .github/scripts/plan-builds matrix "$RUNNER_TEMP/derivations.json" "$FORCED" "$LINUX" "$MAC" >> "$GITHUB_OUTPUT"

  # Builds the home configurations of each system that quick picked.
  #
  # A run that builds nothing leaves the saved Nix store below unread. After a
  # week of that, GitHub may delete it, and the next build compiles herdr-app
  # again. Our own Cachix cache (CI-002) will end this.
  build:
    name: build (${{ matrix.system }})
    needs: quick
    if: needs.quick.outputs.systems != '[]'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # The step that saves the Nix store deletes this branch's older copies.
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.quick.outputs.systems) }}
    steps:
      # This step is first so that its cleanup step runs last: the marker is
      # saved after everything else, and only when the whole job passed. The
      # path must be written exactly as in quick's lookups, or they never find
      # the marker.
      - name: Save the marker when this job passes
        uses: actions/cache@v6
        with:
          path: .ci-marker
          key: ${{ matrix.key }}
      - uses: actions/checkout@v7
      # The Linux build needs a lot of disk. This frees 20 to 30 GB first.
      - name: Free disk space
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@main
      - uses: cachix/install-nix-action@v31
      # Saves the Nix store in GitHub's cache for the next run. The whole Linux
      # build is about 50 GB, over the 10 GB limit, so only what "Keep the
      # slow builds" names is saved. The Mac build takes about six minutes, so
      # it needs no cache.
      - name: Restore and save the Nix store
        if: runner.os == 'Linux'
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 0
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      # Builds only the system of the GitHub machine it runs on.
      - name: Build
        run: nix flake check
      # herdr-app (about 35 minutes) has to be compiled. Naming it here keeps it
      # in the saved store.
      - name: Keep the slow builds
        if: runner.os == 'Linux'
        run: >-
          nix build --out-link "$RUNNER_TEMP/keep"
          '.#homeConfigurations."nelson@framework".pkgs.herdr-app'
      - name: Write the marker
        env:
          KEY: ${{ matrix.key }}
        run: mkdir -p .ci-marker && echo "$KEY built in run $GITHUB_RUN_ID" > .ci-marker/built
