name: CI

on:
  # Other branches get their one run from their pull request.
  push:
    branches: [main, wip]
  pull_request:
  # Mondays: build every system, markers or not, to catch a source that
  # vanished or a cache that went stale. Runs from the default branch only.
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: Build even when these configurations were built before
        type: boolean
        default: false

# A newer run for the same branch or pull request makes the older one useless.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# bash -e -o pipefail: a step stops at its first failed command.
defaults:
  run:
    shell: bash

jobs:
  # Lint, tests, and the evaluation of every configuration, with no disk
  # cleanup and no store cache. It also picks the systems the build job builds.
  quick:
    # A pull request from main or wip of this repository gets no run: the
    # push to that branch had one.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      !contains(fromJSON('["main", "wip"]'), github.head_ref)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      systems: ${{ steps.plan.outputs.systems }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Lint
        run: nix build -L .#checks.x86_64-linux.lint
      - name: Test the helper scripts
        run: bin/test
      # Every check on every system: all seven configurations.
      - name: Evaluate every configuration
        run: bin/check --list > "$RUNNER_TEMP/derivations.json"
      # The rest of what `bin/check --eval` covers. Every helper in bin/ runs
      # in the dev shell, so a broken Mac shell breaks them all on the Mac.
      - name: Evaluate the dev shells and formatters
        run: >-
          nix path-info --derivation
          .#devShells.{x86_64-linux,aarch64-darwin}.default
          .#formatter.{x86_64-linux,aarch64-darwin}
          .#checks.aarch64-darwin.lint
      - name: Make a key per system
        id: keys
        run: .github/scripts/plan-builds keys "$RUNNER_TEMP/derivations.json" >> "$GITHUB_OUTPUT"
      # A marker is a tiny cache entry that a passing build job saved under its
      # key. These only ask whether it exists, from this runner, so no Mac
      # boots for nothing. GitHub limits who sees an entry:
      #
      # - saved on wip: wip, and pull requests into wip;
      # - saved in a pull request: that pull request only;
      # - saved on main: every branch, but main never sees wip's;
      # - filed by path and packing: if the Mac packs differently, its marker
      #   is missed here;
      # - unread for seven days: dropped.
      #
      # A missed marker costs one build, never a wrong pass.
      - name: Look for the Linux marker
        id: linux
        uses: actions/cache/restore@v6
        with:
          path: .ci-marker
          key: ${{ steps.keys.outputs.x86_64-linux }}
          lookup-only: true
      - name: Look for the Mac marker
        id: mac
        uses: actions/cache/restore@v6
        with:
          path: .ci-marker
          key: ${{ steps.keys.outputs.aarch64-darwin }}
          lookup-only: true
      - name: Pick the systems to build
        id: plan
        env:
          FORCED: ${{ github.event_name == 'schedule' || inputs.force == true }}
          LINUX: ${{ steps.linux.outputs.cache-matched-key }}
          MAC: ${{ steps.mac.outputs.cache-matched-key }}
        run: .github/scripts/plan-builds matrix "$RUNNER_TEMP/derivations.json" "$FORCED" "$LINUX" "$MAC" >> "$GITHUB_OUTPUT"

  # Builds the home configurations of each system that quick picked.
  #
  # A run that builds nothing doesn't touch the store cache below. After a week
  # of those, GitHub may drop it, and the next build compiles herdr-app and
  # vicinae from source again. Our own binary cache ends this (CI-002).
  build:
    name: build (${{ matrix.system }})
    needs: quick
    if: needs.quick.outputs.systems != '[]'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # The store cache step deletes this branch's older caches after saving.
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.quick.outputs.systems) }}
    steps:
      # First, so that its closing step runs last: it saves the marker after
      # the store cache, and only when the whole job passed. A forced run that
      # finds the marker has nothing to save. The path must be the same string
      # as in quick's lookups, or they never find it.
      - name: Save the marker when this job passes
        uses: actions/cache@v6
        with:
          path: .ci-marker
          key: ${{ matrix.key }}
      - uses: actions/checkout@v7
      # The Linux closure is large; this frees ~20-30 GB so the build isn't
      # killed for lack of disk.
      - name: Free disk space
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@main
      - uses: cachix/install-nix-action@v31
      # The Linux closure is about 50 GiB, far over the 10 GB cache limit. So
      # before saving, it deletes everything that "Keep the slow builds" does
      # not keep. The Mac build takes about six minutes without a cache.
      - name: Restore and save the Nix store
        if: runner.os == 'Linux'
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 0
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      # Builds this runner's system only.
      - name: Build
        run: nix flake check
      # vicinae (about an hour) and herdr-app (about 35 minutes) build from
      # source. As GC roots they stay in the saved cache.
      - name: Keep the slow builds
        if: runner.os == 'Linux'
        run: >-
          nix build --out-link "$RUNNER_TEMP/keep"
          '.#homeConfigurations."nelson@framework".config.programs.vicinae.package'
          '.#homeConfigurations."nelson@framework".pkgs.herdr-app'
      - name: Write the marker
        env:
          KEY: ${{ matrix.key }}
        run: mkdir -p .ci-marker && echo "$KEY built in run $GITHUB_RUN_ID" > .ci-marker/built
