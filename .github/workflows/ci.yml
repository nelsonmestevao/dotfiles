name: CI
on: [push, pull_request]
# on:
#   push:
#     branches: [main]
#   pull_request:
#     branches: [main]

# A newer push to the same branch makes an older run useless, so cancel it
# instead of letting both build for over an hour.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # deadnix, statix and nixfmt in about a minute. The builds wait for it, so
  # a formatting slip fails fast instead of after an hour.
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix build -L .#checks.x86_64-linux.lint

  check:
    name: check (${{ matrix.system }})
    needs: lint
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # The cache step deletes this branch's older caches after saving one.
      actions: write
    strategy:
      # Report every system independently instead of cancelling the rest when
      # one fails.
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            os: ubuntu-latest
          - system: aarch64-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
      # The Linux runner builds the full x86_64-linux closure from source
      # (a large Rust app among others); reclaim ~20-30GB so it doesn't run
      # out of disk and get killed mid-build.
      - name: Free disk space
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@main
      - uses: cachix/install-nix-action@v31
      # Restores the Nix store from GitHub's own cache here, and saves it at the
      # end of a passing job. The Linux closure is about 50 GiB, far over the
      # 10 GB cache limit, so before saving it deletes everything that isn't
      # kept by the "Keep the slow builds" step below. The macOS job takes a
      # few minutes, so it doesn't need a cache.
      - name: Restore and save the Nix store
        if: runner.os == 'Linux'
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 0
          # After saving, delete this branch's older caches.
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      # Without --all-systems, `nix flake check` builds only the runner's
      # native system (x86_64-linux on ubuntu, aarch64-darwin on macos), so
      # each matrix job checks exactly one system in parallel. The checks are
      # the home configurations (built) and the system configurations
      # (evaluated, see flake.nix).
      - run: nix flake check
      # Most of the closure downloads from cache.nixos.org in about 8 minutes.
      # These are built from source and slow: vicinae takes about an hour and
      # herdr-app about 35 minutes. Marking them as GC roots keeps them (and
      # what they need at runtime, about 1.3 GiB) in the saved cache.
      - name: Keep the slow builds
        if: runner.os == 'Linux'
        run: |
          nix build --out-link "$RUNNER_TEMP/keep" \
            '.#homeConfigurations."nelson@framework".config.programs.vicinae.package' \
            '.#homeConfigurations."nelson@framework".pkgs.herdr-app'
